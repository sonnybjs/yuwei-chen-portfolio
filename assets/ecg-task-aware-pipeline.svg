<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Task-aware ECG classification and denoising pipeline</title>
  <desc id="desc">A conceptual diagram showing raw and denoised ECG traces followed by classifier, frozen task model, denoiser fine-tuning and validation stages.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#344149" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19242b"/>
      <stop offset="1" stop-color="#10161b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1000" fill="#10161b"/>
  <rect x="34" y="34" width="832" height="932" fill="url(#panel)" stroke="#45535b"/>
  <rect x="34" y="34" width="832" height="932" fill="url(#grid)" opacity="0.42"/>

  <g font-family="Arial, sans-serif">
    <text x="70" y="84" fill="#f3f1ec" font-size="22" font-weight="700">TASK-AWARE ECG PIPELINE</text>
    <text x="70" y="112" fill="#8f9aa0" font-size="12">CLASSIFIER-FIRST · MORPHOLOGY-PRESERVING · EXPERIMENT-TRACKED</text>

    <text x="70" y="158" fill="#e7736b" font-size="11" font-weight="700">RAW SIGNAL</text>
    <path d="M70 246 L98 241 L125 251 L152 237 L180 247 L207 241 L234 250 L254 225 L269 242 L292 239 L308 244 L321 204 L331 146 L343 304 L356 230 L373 190 L392 245 L419 239 L446 248 L473 240 L500 244 L527 238 L554 248 L574 224 L589 242 L612 239 L628 244 L641 205 L651 148 L663 302 L676 229 L693 191 L712 245 L739 239 L766 248 L793 240 L829 243" fill="none" stroke="#ef5047" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M70 255H829" fill="none" stroke="#53636c" stroke-width="1" stroke-dasharray="5 8"/>

    <text x="70" y="350" fill="#58c4c0" font-size="11" font-weight="700">DENOISED SIGNAL</text>
    <path d="M70 435 L120 435 L170 434 L218 435 L262 432 L276 405 L287 348 L299 491 L311 422 L327 386 L345 435 L390 435 L438 434 L486 435 L530 432 L544 405 L555 350 L567 489 L579 421 L595 387 L613 435 L658 435 L706 434 L754 435 L798 433 L829 434" fill="none" stroke="#43c2be" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M70 447H829" fill="none" stroke="#53636c" stroke-width="1" stroke-dasharray="5 8"/>

    <text x="70" y="512" fill="#d9a44f" font-size="11" font-weight="700">TRAINING AND EVALUATION FLOW</text>

    <rect x="70" y="540" width="350" height="142" fill="#202b32" stroke="#596970"/>
    <text x="92" y="572" fill="#e7736b" font-size="11" font-weight="700">01</text>
    <text x="92" y="610" fill="#f3f1ec" font-size="21" font-weight="700">TRAIN CLASSIFIER</text>
    <text x="92" y="638" fill="#a7b2b7" font-size="12">Rhythm and detection targets</text>
    <text x="92" y="659" fill="#7f8b91" font-size="11">Mapped taxonomies · pretrained backbone</text>

    <rect x="480" y="540" width="350" height="142" fill="#202b32" stroke="#596970"/>
    <text x="502" y="572" fill="#d9a44f" font-size="11" font-weight="700">02</text>
    <text x="502" y="610" fill="#f3f1ec" font-size="21" font-weight="700">FREEZE TASK MODEL</text>
    <text x="502" y="638" fill="#a7b2b7" font-size="12">Keep downstream objective fixed</text>
    <text x="502" y="659" fill="#7f8b91" font-size="11">Gradient path remains auditable</text>

    <path d="M430 611H468" stroke="#d9a44f" stroke-width="2"/>
    <path d="M460 603L468 611L460 619" fill="none" stroke="#d9a44f" stroke-width="2"/>

    <rect x="70" y="722" width="350" height="142" fill="#202b32" stroke="#596970"/>
    <text x="92" y="754" fill="#43c2be" font-size="11" font-weight="700">03</text>
    <text x="92" y="792" fill="#f3f1ec" font-size="21" font-weight="700">FINE-TUNE DENOISER</text>
    <text x="92" y="820" fill="#a7b2b7" font-size="12">Task loss + morphology guards</text>
    <text x="92" y="841" fill="#7f8b91" font-size="11">Anchor MSE · slope consistency</text>

    <rect x="480" y="722" width="350" height="142" fill="#202b32" stroke="#596970"/>
    <text x="502" y="754" fill="#6da8d2" font-size="11" font-weight="700">04</text>
    <text x="502" y="792" fill="#f3f1ec" font-size="21" font-weight="700">VALIDATE</text>
    <text x="502" y="820" fill="#a7b2b7" font-size="12">MIL · thresholds · per-class reports</text>
    <text x="502" y="841" fill="#7f8b91" font-size="11">Checkpoints · manifests · evidence</text>

    <path d="M430 793H468" stroke="#d9a44f" stroke-width="2"/>
    <path d="M460 785L468 793L460 801" fill="none" stroke="#d9a44f" stroke-width="2"/>
    <path d="M655 693V711" stroke="#d9a44f" stroke-width="2"/>
    <path d="M647 703L655 711L663 703" fill="none" stroke="#d9a44f" stroke-width="2"/>

    <rect x="70" y="906" width="155" height="28" fill="#2b363d"/>
    <text x="84" y="925" fill="#cbd2d5" font-size="10">PYTORCH</text>
    <rect x="233" y="906" width="155" height="28" fill="#2b363d"/>
    <text x="247" y="925" fill="#cbd2d5" font-size="10">CNN-BILSTM</text>
    <rect x="396" y="906" width="125" height="28" fill="#2b363d"/>
    <text x="410" y="925" fill="#cbd2d5" font-size="10">MIL</text>
    <text x="830" y="925" text-anchor="end" fill="#7f8b91" font-size="10">CONCEPTUAL · NO PATIENT DATA</text>
  </g>
</svg>
